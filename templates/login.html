<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('ccms_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Student Login - Campus Complaint Management System"/>
  <title>Student Login | CampusVoice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <link rel="stylesheet" href="/static/css/responsive.css"/>
</head>
<body>

<div id="toastContainer" class="toast-container-custom"></div>

<section class="auth-section">
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>

  <!-- Back to Home -->
  <a href="/" style="position:fixed;top:20px;left:20px;display:flex;align-items:center;gap:0.5rem;color:rgba(255,255,255,0.75);font-size:0.85rem;text-decoration:none;z-index:10;transition:color 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.75)'">
    <i class="bi bi-arrow-left-circle-fill" style="font-size:1.2rem;"></i> Back to Home
  </a>

  <!-- Theme Toggle -->
  <button class="theme-toggle" style="position:fixed;top:20px;right:20px;z-index:10;">
    <span class="theme-icon">🌙</span>
  </button>

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">🏫</div>
      <div>
        <div style="font-size:1rem;font-weight:800;color:var(--text-primary);">CampusVoice</div>
        <div style="font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;">Student Portal</div>
      </div>
    </div>

    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to your student account to file and track complaints</p>

    <!-- Login Form -->
    <form id="loginForm" data-validate action="/login" method="POST">

      <!-- Email -->
      <div class="mb-1">
        <label class="form-label-custom" for="email">Email Address</label>
      </div>
      <div class="input-group-custom">
        <span class="input-icon"><i class="bi bi-envelope-fill"></i></span>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control-custom"
          placeholder="yourname@student.edu"
          required
          autocomplete="email"
        />
      </div>

      <!-- Password -->
      <div class="mb-1">
        <label class="form-label-custom" for="password">Password</label>
      </div>
      <div class="input-group-custom">
        <span class="input-icon"><i class="bi bi-lock-fill"></i></span>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control-custom"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
          style="padding-right:2.75rem"
        />
        <span class="input-icon-right" data-toggle-pw="#password" title="Toggle password visibility">👁️</span>
      </div>

      <!-- Remember & Forgot -->
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="form-check form-check-custom">
          <input class="form-check-input" type="checkbox" id="rememberMe" name="remember"/>
          <label class="form-check-label" for="rememberMe" style="font-size:0.85rem;color:var(--text-secondary);">
            Remember me
          </label>
        </div>
        <a href="#" class="auth-link" style="font-size:0.85rem;" onclick="handleForgotPassword(event)">
          Forgot password?
        </a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit" id="loginBtn" onclick="handleLogin(event)">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>

    </form>



    <p class="auth-footer-text">
      Don't have an account? <a href="/register" class="auth-link">Create one now</a>
    </p>

    <p class="auth-footer-text" style="margin-top:0.5rem;">
      Are you an admin? <a href="/admin/login" class="auth-link" style="color:var(--accent);">Admin Login →</a>
    </p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
<script>
function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const pass  = document.getElementById('password').value;
  if (!email || !pass) {
    Toast.warning('Missing Fields', 'Please enter your email and password.');
    return;
  }
  const btn = document.getElementById('loginBtn');
  btn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle"></span>Signing in...';
  btn.disabled = true;

  fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: pass })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      Toast.success('Login Successful', 'Welcome to CampusVoice!');
      setTimeout(() => {
        window.location.href = data.redirect;
      }, 400);
    } else {
      Toast.error('Login Failed', data.message || 'Invalid email or password.');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
    }
  })
  .catch(err => {
    console.error(err);
    Toast.error('Server Error', 'Failed to connect to backend.');
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
  });
}

function handleForgotPassword(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  if (!email) {
    Toast.warning('Enter Email', 'Please enter your email address first.');
    return;
  }
  Toast.success('Reset Link Sent', `Password reset instructions sent to ${email}`);
}
</script>
</body>
</html>
