<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('ccms_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Admin Login - Campus Complaint Management System"/>
  <title>Admin Login | CampusVoice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <link rel="stylesheet" href="/static/css/responsive.css"/>
  <style>
    .auth-section { background: linear-gradient(135deg, #050a18 0%, #0d1b3e 40%, #1a1040 70%, #0d1b3e 100%); }
    .auth-orb-1 { background: #7c3aed; }
    .auth-orb-2 { background: #1e40af; }
    .admin-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
      color: #f87171; padding: 0.35rem 0.9rem; border-radius: 99px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 1rem;
    }
    .security-info {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 0.78rem;
      color: #d97706;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>

<div id="toastContainer" class="toast-container-custom"></div>

<section class="auth-section">
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>

  <a href="/login" style="position:fixed;top:20px;left:20px;display:flex;align-items:center;gap:0.5rem;color:rgba(255,255,255,0.75);font-size:0.85rem;text-decoration:none;z-index:10;">
    <i class="bi bi-arrow-left-circle-fill" style="font-size:1.2rem;"></i> Student Portal
  </a>
  <button class="theme-toggle" style="position:fixed;top:20px;right:20px;z-index:10;">
    <span class="theme-icon">🌙</span>
  </button>

  <div class="auth-card">
    <div class="text-center mb-3">
      <div style="width:64px;height:64px;background:linear-gradient(135deg,#7c3aed,#4f46e5);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1rem;box-shadow:0 8px 25px rgba(124,58,237,0.4);">🛡️</div>
      <div class="admin-badge">🔒 Restricted Access</div>
    </div>

    <h1 class="auth-title" style="text-align:center;">Administrator Login</h1>
    <p class="auth-subtitle" style="text-align:center;">Access the campus complaint management control panel</p>

    <div class="security-info">
      ⚠️ <strong>Authorized Personnel Only.</strong> All login attempts are monitored and logged for security purposes.
    </div>

    <form id="adminLoginForm" action="/admin/login" method="POST">
      <!-- Admin ID -->
      <div class="mb-1"><label class="form-label-custom" for="adminEmail">Administrator Email</label></div>
      <div class="input-group-custom">
        <span class="input-icon"><i class="bi bi-shield-fill"></i></span>
        <input type="email" id="adminEmail" name="email" class="form-control-custom" placeholder="admin@campus.edu" required/>
      </div>

      <!-- Password -->
      <div class="mb-1"><label class="form-label-custom" for="adminPassword">Admin Password</label></div>
      <div class="input-group-custom">
        <span class="input-icon"><i class="bi bi-key-fill"></i></span>
        <input type="password" id="adminPassword" name="password" class="form-control-custom" placeholder="Enter admin password" required style="padding-right:2.75rem;"/>
        <span class="input-icon-right" data-toggle-pw="#adminPassword" title="Toggle">👁️</span>
      </div>

      <!-- Session -->
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="form-check form-check-custom">
          <input class="form-check-input" type="checkbox" id="adminSession"/>
          <label class="form-check-label" for="adminSession" style="font-size:0.82rem;color:var(--text-secondary);">Keep session active</label>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="adminLoginBtn" onclick="handleAdminLogin(event)"
        style="background:linear-gradient(135deg,#7c3aed,#4f46e5);box-shadow:0 8px 25px rgba(124,58,237,0.4);">
        <i class="bi bi-shield-lock-fill"></i> Secure Admin Access
      </button>
    </form>


    <p class="auth-footer-text mt-3">
      Student? <a href="/login" class="auth-link">Go to Student Login →</a>
    </p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
<script>
function handleAdminLogin(e) {
  e.preventDefault();
  const email = document.getElementById('adminEmail').value;
  const pass  = document.getElementById('adminPassword').value;
  if (!email || !pass) {
    Toast.warning('Missing Fields', 'Please enter admin credentials.');
    return;
  }
  const btn = document.getElementById('adminLoginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle"></span>Authenticating...';

  fetch('/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: pass })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      Toast.success('Access Granted', 'Welcome, Administrator. Loading control panel...');
      setTimeout(() => {
        window.location.href = data.redirect;
      }, 400);
    } else {
      Toast.error('Access Denied', data.message || 'Invalid admin credentials.');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-shield-lock-fill"></i> Secure Admin Access';
    }
  })
  .catch(err => {
    console.error(err);
    Toast.error('Server Error', 'Failed to connect to backend.');
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-shield-lock-fill"></i> Secure Admin Access';
  });
}
</script>
</body>
</html>
